# spec-flow CI contract — Gradle. See references/ci/README.md.
# Runs the FULL suite (unit `test` + `integrationTest`). On test failure, writes the failing test
# ids (one `com.example.FooTest.method` per line) to spec-flow-failures.txt and uploads it as the
# `spec-flow-failures` artifact, which /spec-flow:sync-ci pulls into the branch's flagged set.
# Enable this check in branch protection so merge is gated on green CI.
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run full suite (unit + integration)
        # `check` must depend on `integrationTest` (see docs/workflow.md, Gradle tiering) so the
        # integration tier actually runs in CI. Adjust if your integration task is named differently.
        run: ./gradlew check
      - name: Collect failing test ids
        if: failure()
        run: |
          python3 - <<'PY' > spec-flow-failures.txt
          import glob, xml.etree.ElementTree as ET
          ids = set()
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  if any(c.tag in ("failure", "error") for c in tc):
                      cls, name = tc.get("classname", ""), tc.get("name", "")
                      if cls and name:
                          ids.add(f"{cls}.{name}")
          print("\n".join(sorted(ids)))
          PY
      - name: Upload failing test ids
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spec-flow-failures
          path: spec-flow-failures.txt
          if-no-files-found: ignore
