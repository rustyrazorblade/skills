# spec-flow CI contract — Gradle. See references/ci/README.md.
# Runs the FULL suite (unit `test` + `integrationTest`). On test failure, writes the failing test
# ids (one `com.example.FooTest.method` per line) to spec-flow-failures.txt and uploads it as the
# `spec-flow-failures` artifact, which /spec-flow:sync-ci pulls into the branch's flagged set.
# Enable this check in branch protection so merge is gated on green CI.
name: tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # Checkpoint pushes during /spec-flow:implement recur often — cancel a superseded run rather
  # than let it finish and confuse /spec-flow:sync-ci's "most recent completed run" pick.
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        # Wrapper/distribution cache + Gradle build cache — checkpoint pushes during
        # /spec-flow:implement recur often, so a cold build here defeats "keep CI warm".
      - name: Run full suite (unit + integration)
        # `check` must depend on `integrationTest` (see docs/workflow.md, Gradle tiering) so the
        # integration tier actually runs in CI. Adjust if your integration task is named differently.
        # `--continue` matters here: without it, a failing `test` task stops the build before
        # `integrationTest` ever runs, so a single unit failure would hide any integration
        # regressions from this same run's failures artifact.
        run: ./gradlew check --continue
      - name: Collect failing test ids
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ids = set()
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  if any(c.tag in ("failure", "error") for c in tc):
                      cls, name = tc.get("classname", ""), tc.get("name", "")
                      if cls and name:
                          ids.add(f"{cls}.{name}")
          # Only write the file when there are actual test-failure ids. A compile/lint break
          # fails the job with no testcase XML at all; leaving spec-flow-failures.txt unwritten
          # (vs. writing an empty file) lets `if-no-files-found: ignore` skip the upload, so
          # /spec-flow:sync-ci correctly reads "not a test failure" instead of an empty artifact.
          if ids:
              with open("spec-flow-failures.txt", "w") as fh:
                  fh.write("\n".join(sorted(ids)) + "\n")
              # Also surface them on the run's summary page — no artifact download needed to see
              # what broke.
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("## Failing tests\n\n")
                      fh.write("\n".join(f"- `{i}`" for i in sorted(ids)) + "\n")
          PY
      - name: Upload failing test ids
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spec-flow-failures
          path: spec-flow-failures.txt
          if-no-files-found: ignore
