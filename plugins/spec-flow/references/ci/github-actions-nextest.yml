# spec-flow CI contract — cargo nextest. See references/ci/README.md.
# Runs the FULL suite (all tiers, including #[ignore]'d). On test failure, writes the failing test
# ids (one nextest test path per line) to spec-flow-failures.txt and uploads it as the
# `spec-flow-failures` artifact, which /spec-flow:sync-ci pulls into the branch's flagged set.
# Requires a JUnit report from nextest — add to .config/nextest.toml:
#   [profile.ci.junit]
#   path = "junit.xml"
# Enable this check in branch protection so merge is gated on green CI.
name: tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  # Checkpoint pushes during /spec-flow:implement recur often — cancel a superseded run rather
  # than let it finish and confuse /spec-flow:sync-ci's "most recent completed run" pick.
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        # Caches ~/.cargo/registry, ~/.cargo/git, and target/ keyed on Cargo.lock — checkpoint
        # pushes during /spec-flow:implement recur often, so a cold build defeats "keep CI warm".
      - uses: taiki-e/install-action@nextest
      - name: Run full suite (all tiers)
        run: cargo nextest run --profile ci --run-ignored all
      - name: Collect failing test ids
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ids = set()
          # nextest writes its JUnit report under target/nextest/<profile>/ (path from nextest.toml)
          for f in glob.glob("target/nextest/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except ET.ParseError:
                  continue
              for tc in root.iter("testcase"):
                  if any(c.tag in ("failure", "error") for c in tc):
                      name = tc.get("name", "")
                      if name:
                          ids.add(name)
          # Only write the file when there are actual test-failure ids. A compile break fails the
          # job with no JUnit XML at all; leaving spec-flow-failures.txt unwritten (vs. writing an
          # empty file) lets `if-no-files-found: ignore` skip the upload, so /spec-flow:sync-ci
          # correctly reads "not a test failure" instead of an empty artifact.
          if ids:
              with open("spec-flow-failures.txt", "w") as fh:
                  fh.write("\n".join(sorted(ids)) + "\n")
              # Also surface them on the run's summary page — no artifact download needed to see
              # what broke.
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a") as fh:
                      fh.write("## Failing tests\n\n")
                      fh.write("\n".join(f"- `{i}`" for i in sorted(ids)) + "\n")
          PY
      - name: Upload failing test ids
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spec-flow-failures
          path: spec-flow-failures.txt
          if-no-files-found: ignore
